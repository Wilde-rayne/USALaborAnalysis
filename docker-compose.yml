services:
  ollama:
    # Use the official Ollama image instead of a custom Dockerfile.
    # Models are pulled at runtime by deploy.sh (or manually with
    # `docker compose exec ollama ollama pull llama2:chat`) and persisted
    # in the ollama_data volume across restarts.
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # NUM_PARALLEL=1 matches MAX_LOADED_MODELS=1: the
      # BlurbOrchestrator serialises specialist calls (see comment in
      # ``utils/agents/blurb_orchestra.py`` around the single-model
      # rationale), so allowing Ollama to interleave streams pointed
      # to the same single resident runner was paying scheduler cost
      # for no concurrency.
      OLLAMA_NUM_PARALLEL: "1"
      # MAX_LOADED_MODELS=1 — the orchestrator now uses a single
      # model (``OLLAMA_MODEL``, llama3.2:3b) for every specialist
      # because phi3's runner crashed under 7.5 GB container RAM
      # when llama3.2:3b was also resident. One loaded model means
      # one runner, no second-model load to fail.
      OLLAMA_MAX_LOADED_MODELS: "1"
      # KEEP_ALIVE: longer than the default 5 m so the model stays
      # warm across the user reading panels + asking follow-ups.
      OLLAMA_KEEP_ALIVE: "30m"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Official ollama image has no curl; use the CLI against the local
      # server. `ollama list` exits non-zero if the server isn't answering.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: on-failure
    networks:
      - app-net

  # Spark master/worker containers were dropped in favor of embedded
  # PySpark in `local[*]` mode inside the dashboard container:
  # - utils/embeddings.py already falls back to local[*] when
  #   SPARK_MASTER_URL is unset, so embedding ~3k RAG snippets runs
  #   in-process with no cluster coordination overhead.
  # - The old bitnami/spark:latest tag was retired from Docker Hub
  #   when Bitnami moved their free images behind the Secure catalog.
  # - Removing the cluster also reclaims ~6GB of the Docker Desktop
  #   memory budget for Ollama inference.
  # If the workload ever outgrows local[*], reintroduce a cluster
  # using apache/spark:<pinned> and set SPARK_MASTER_URL on the
  # dashboard service.

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      OLLAMA_URL: "http://ollama:11434"           # Ollama API base URL for chat
      OLLAMA_API_PATH: "/v1/chat/completions"     # Chat endpoint path
      # Two-model setup: a fast 3B for the user-facing chat, and phi3 for
      # internal agents (summarization, blurb generation, sentence-RAG
      # preprocessing). Both run on CPU in reasonable time; llama2:chat
      # was kept behind at 7B and the 180 s default timeout was hitting it.
      OLLAMA_MODEL: "llama3.2:3b"
      OLLAMA_AGENT_MODEL: "phi3"
      # Reactive-startup control; see .env.example for the full enum.
      # "data"       — cache-aware data fetch only (seconds when cached).
      # "lfp"        — + train the ~10 LFP LSTM models (about a minute).
      # "full"       — + train 540 supersector × horizon models (~45 min).
      # "none"       — pure lazy; everything on demand.
      PRELOAD_SCOPE: "${PRELOAD_SCOPE:-data}"
      CACHE_MAX_AGE_SECONDS: "${CACHE_MAX_AGE_SECONDS:-604800}"  # 7 days
      # Secrets: pulled from repo-root .env via compose substitution.
      # BLS key is optional (unregistered calls are rate-limited).
      # Census key is required; `:?` makes compose fail fast if missing.
      BLS_API_KEY: "${BLS_API_KEY:-}"
      CENSUS_API_KEY: "${CENSUS_API_KEY:?CENSUS_API_KEY not set. Copy .env.example to .env and fill it in.}"
      # Optional — only needed if the BEA fetch agent runs.
      BEA_API_KEY: "${BEA_API_KEY:-}"
      # Optional — only needed if the FRED fetch agent runs.
      FRED_API_KEY: "${FRED_API_KEY:-}"
      # Flask session-cookie signing key. Optional in dev (a per-process
      # random key is generated on startup) but MUST be set to a stable
      # 32+ byte hex string in production so signed cookies survive
      # restarts and so multi-worker / multi-replica deployments share
      # the same signing secret. Generate with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-}"
      # Flip to "1" once the deployment sits behind TLS termination so
      # the session cookie gets the Secure flag. Leave unset on the
      # plain-HTTP local docker-compose target.
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-}"
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data:rw
    # The container used to run `python -m utils.data_pipeline && gunicorn`
    # so every start paid the full BLS/Census round-trip. Now the
    # PRELOAD_SCOPE-aware background thread in app.py handles data
    # availability (cache-hit when the mounted ./data is fresh), so
    # gunicorn can bind to 8050 in seconds.
    command: >
      gunicorn app:server
      --bind 0.0.0.0:8050
      --workers 1
      --threads 8
      --worker-class gthread
      --timeout 300
      --graceful-timeout 30
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8050/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: on-failure
    networks:
      - app-net

volumes:
  ollama_data:

networks:
  app-net:
    driver: bridge
