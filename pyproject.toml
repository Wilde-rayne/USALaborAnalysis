# Project-level configuration for tooling (pytest, coverage, ruff).
# This file does not build a distributable package; the app is run as a
# service via docker-compose. A [project] table is kept for metadata only.

[project]
name            = "usa-labor-analysis"
version         = "0.1.0"
description     = "Prairie Insights — containerized US labor analytics platform with LSTM forecasting and local RAG."
readme          = "README.md"
requires-python = ">=3.11"  # runtime pins tensorflow etc. in requirements.txt
license         = { text = "MIT" }
authors         = [{ name = "rayne wilde", email = "rayne.k.wilde@gmail.com" }]
keywords        = ["bls", "census", "labor", "forecasting", "dash", "ollama", "rag"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: tests that take more than ~1s to run",
    "integration: tests that require external services (BLS, Census, Ollama)",
    "numerical: numerical/statistical correctness tests",
]
# Keep warnings visible but don't make them fatal yet — heavy deps
# (tensorflow, pyspark) emit DeprecationWarnings we don't control.
filterwarnings = [
    "default",
    "ignore::DeprecationWarning:pkg_resources",
]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["utils", "tabs", "app"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "utils/preload_state.py",
]

[tool.coverage.report]
precision      = 1
show_missing   = true
skip_covered   = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# --------------------------------------------------------------------------
# ruff — linter + formatter
# --------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py311"
extend-exclude = [
    "data/",
    "assets/",
    "*.ipynb",
    ".venv/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in default args (common in Dash)
    "SIM108",# ternary style — let authors choose
]

[tool.ruff.lint.per-file-ignores]
"tests/*"    = ["B011", "S101"]   # allow asserts in tests
"app.py"     = ["E402"]           # Dash init patterns
"tabs/*"     = ["E402"]           # Dash callback registration ordering
